services:
  metrio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrio
    restart: unless-stopped

    ports:
      - "9085:80"

    volumes:
      # Při lokálním vývoji se změny projeví okamžitě
      - ./:/var/www/html

    networks:
      - proclient

networks:
  proclient:
    external: true