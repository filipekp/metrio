name: Build release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP and test calculations
        run: |
          set -euo pipefail
          find src bin public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/consumption.php
      - name: Create versioned package and SHA256
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -a src bin public migrations staging/
          cp README.md .env.example staging/
          printf '%s\n' "$TAG" > staging/VERSION
          cd staging
          zip -qr "../dist/evidence-energii-${TAG}.zip" src bin public migrations README.md .env.example VERSION
          cd ../dist
          sha256sum "evidence-energii-${TAG}.zip" > "evidence-energii-${TAG}.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/evidence-energii-${TAG}.zip" "dist/evidence-energii-${TAG}.zip.sha256" --verify-tag --generate-notes --title "Evidence energií ${TAG}"
